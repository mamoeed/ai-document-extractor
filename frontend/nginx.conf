server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    # Docker's embedded DNS: resolve "backend" per request so nginx starts even
    # while the backend container is still starting or restarting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads are processed synchronously; must exceed VLM_TOTAL_TIMEOUT_S (600s default).
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_request_buffering off;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
