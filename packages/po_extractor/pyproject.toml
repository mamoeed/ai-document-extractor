[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "po_extractor"
version = "0.1.0"
description = "Purchase order extraction (VLM) and deterministic master-data matching"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "openai>=1.40,<3",
    "pypdfium2>=4.30,<6",
    "pillow>=10.4",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
po-extractor = "po_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests spend DeepInfra tokens: opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: calls the real DeepInfra VLM (skipped unless DEEPINFRA_API_KEY is set)",
]
